name: Build and publish Linux releases

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build Linux binary
        env:
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          mkdir -p dist
          GOOS=linux go build -trimpath -ldflags="-s -w" -o dist/fakefido .
          tar -C dist -czf "fakefido-linux-${GOARCH}.tar.gz" fakefido
          sha256sum "fakefido-linux-${GOARCH}.tar.gz" > "fakefido-linux-${GOARCH}.tar.gz.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: fakefido-linux-${{ matrix.goarch }}
          path: |
            fakefido-linux-${{ matrix.goarch }}.tar.gz
            fakefido-linux-${{ matrix.goarch }}.tar.gz.sha256
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: fakefido-linux-*
          merge-multiple: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Attach binaries to GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release view "$RELEASE_TAG" >/dev/null 2>&1 || gh release create "$RELEASE_TAG" --generate-notes --verify-tag
          gh release upload "$RELEASE_TAG" dist/*.tar.gz dist/*.sha256 --clobber
      - name: Enable R2 public downloads
        id: r2
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          R2_BUCKET: ${{ secrets.CLOUDFLARE_R2_BUCKET }}
        run: |
          test -n "$CLOUDFLARE_ACCOUNT_ID"
          test -n "$CLOUDFLARE_API_TOKEN"
          test -n "$R2_BUCKET"
          npx --yes wrangler@4 r2 bucket dev-url enable "$R2_BUCKET" --force
          R2_PUBLIC_URL="$(npx --yes wrangler@4 r2 bucket dev-url get "$R2_BUCKET" | sed -nE "s/.*(https:\/\/[^']+).*/\\1/p" | head -n 1)"
          test -n "$R2_PUBLIC_URL"
          echo "public_url=$R2_PUBLIC_URL" >> "$GITHUB_OUTPUT"
      - name: Update direct install links
        env:
          R2_PUBLIC_URL: ${{ steps.r2.outputs.public_url }}
        run: |
          sed -i "s|__FAKEFIDO_R2_PUBLIC_URL__|$R2_PUBLIC_URL|g" README.md site/index.html install.sh
          sed -i -E "s|https://pub-[^/ ]+\.r2\.dev|$R2_PUBLIC_URL|g" README.md site/index.html install.sh
      - name: Upload release files to R2
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          R2_BUCKET: ${{ secrets.CLOUDFLARE_R2_BUCKET }}
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || format('manual-{0}', github.run_number) }}
        run: |
          for file in dist/*; do
            name="$(basename "$file")"
            npx --yes wrangler@4 r2 object put "$R2_BUCKET/releases/$RELEASE_TAG/$name" --file="$file" --remote
            npx --yes wrangler@4 r2 object put "$R2_BUCKET/latest/$name" --file="$file" --remote
          done
          npx --yes wrangler@4 r2 object put "$R2_BUCKET/latest/install.sh" --file=install.sh --remote
      - name: Commit public download URL changes
        run: |
          if ! git diff --quiet -- README.md site/index.html install.sh; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add README.md site/index.html install.sh
            git commit -m "doc: update public release download URL"
            git push origin HEAD:main
          fi
      - name: Deploy landing page with the release URL
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site --project-name=fakefido
